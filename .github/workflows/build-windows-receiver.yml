name: WireDesk build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiredesk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify versions
        run: python3 scripts/check-version.py
      - name: Build universal Mac application
        env:
          WIREDESK_UNIVERSAL: '1'
        run: |
          scripts/build-wiredesk-mac.sh dist/WireDesk.app
          ditto -c -k --sequesterRsrc --keepParent dist/WireDesk.app dist/WireDesk-mac-universal.zip
      - name: Test protocol and hardware decoder
        run: |
          brew install ffmpeg
          BETTERCAST_TEST_WORK="$RUNNER_TEMP/ethernet-tests" scripts/test-ethernet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WireDesk-mac
          path: dist/WireDesk-mac-universal.zip
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify versions
        run: python scripts/check-version.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        shell: pwsh
        run: |
          pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.7.0 win64_msvc2019_64 --modules qtmultimedia --outputdir C:/Qt --external "C:/Program Files/7-Zip/7z.exe"
          "C:/Qt/6.7.0/msvc2019_64/bin" >> $env:GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: wiredesk-vcpkg-ffmpeg-v1-${{ runner.os }}
      - name: Install FFmpeg hardware encoders and x264
        shell: pwsh
        run: |
          vcpkg install "ffmpeg[x264,nvcodec,amf,qsv]:x64-windows" --recurse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Windows application and tests
        shell: pwsh
        run: |
          cmake -S Sources/BetterCastReceiverDesktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_PREFIX_PATH=C:/Qt/6.7.0/msvc2019_64 -DENABLE_SENDER=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S Tests/Ethernet -B test-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_PREFIX_PATH=C:/Qt/6.7.0/msvc2019_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build test-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:/vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Run pairing and encoder tests
        shell: pwsh
        run: |
          ctest --test-dir test-build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch pinned WinSparkle
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip -OutFile winsparkle.zip
          if ((Get-FileHash winsparkle.zip -Algorithm SHA256).Hash.ToLower() -ne '6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976') { throw 'WinSparkle checksum mismatch' }
          Expand-Archive winsparkle.zip winsparkle
      - name: Package runtime and notices
        shell: pwsh
        run: |
          New-Item artifact -ItemType Directory | Out-Null
          Copy-Item build/WireDesk.exe artifact/
          windeployqt --release --no-translations artifact/WireDesk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item C:/vcpkg/installed/x64-windows/bin/*.dll artifact/
          Copy-Item winsparkle/WinSparkle-0.9.4/x64/Release/WinSparkle.dll artifact/
          Copy-Item LICENSE,ACKNOWLEDGMENTS.md artifact/
          Copy-Item licenses artifact/ -Recurse
          New-Item artifact/licenses/dependencies -ItemType Directory | Out-Null
          Get-ChildItem C:/vcpkg/installed/x64-windows/share -Directory | ForEach-Object {
            if (Test-Path "$($_.FullName)/copyright") { Copy-Item "$($_.FullName)/copyright" "artifact/licenses/dependencies/$($_.Name).txt" }
          }
          Copy-Item C:/Qt/6.7.0/msvc2019_64/LICENSES artifact/licenses/Qt -Recurse
          $version=(Get-Content VERSION -Raw).Trim()
          if ((Get-Item artifact/WireDesk.exe).VersionInfo.ProductVersion -ne $version) { throw 'EXE version mismatch' }
          Compress-Archive artifact/* "WireDesk-Windows-x64-portable.zip"
      - name: Build per-user installer
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          Copy-Item artifact Sources/BetterCastReceiverDesktop/artifact -Recurse
          Push-Location Sources/BetterCastReceiverDesktop
          & 'C:/Program Files (x86)/NSIS/makensis.exe' "/DPRODUCT_VERSION=$version" "/DPRODUCT_NUMERIC_VERSION=$version.0" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Move-Item Sources/BetterCastReceiverDesktop/WireDesk-Setup-*.exe ./
      - uses: actions/upload-artifact@v4
        with:
          name: WireDesk-windows
          path: |
            WireDesk-Setup-*.exe
            WireDesk-Windows-x64-portable.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: WireDesk-*
          merge-multiple: true
          path: dist
      - name: Sign and verify OTA archives
        env:
          OTA_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/check-version.py "$GITHUB_REF_NAME"
          test -n "$OTA_KEY" || { echo 'SPARKLE_EDDSA_PRIVATE_KEY is required'; exit 1; }
          curl -fL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          umask 077
          printf '%s' "$OTA_KEY" > "$RUNNER_TEMP/ota.key"
          trap 'rm -f "$RUNNER_TEMP/ota.key"' EXIT
          python3 scripts/publish-appcasts.py --sign-tool "$RUNNER_TEMP/sparkle/bin/sign_update" --key-file "$RUNNER_TEMP/ota.key" --mac dist/WireDesk-mac-universal.zip --windows "dist/WireDesk-Setup-$(cat VERSION).exe" --output dist
          shasum -a 256 dist/*.zip dist/*.exe > dist/SHA256SUMS.txt
      - name: Publish release and feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "WireDesk $(cat VERSION)" --notes-file docs/release-notes.md --verify-tag
